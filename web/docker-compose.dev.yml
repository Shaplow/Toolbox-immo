services:
  postgres:
    image: postgres:16-alpine
    container_name: templategen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: templategen
      POSTGRES_PASSWORD: templategen
      POSTGRES_DB: templategen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
